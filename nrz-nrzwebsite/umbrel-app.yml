description: >-
  nrzWebsite ist deine persoenliche Seite mit Blog und gleichzeitig ein
  Website-Hoster fuer deine Programme auf nrzGit - komplett in Rust (Rocket +
  Leptos mit Komponenten von Rust/UI).


  ## Ports

  - **8441 - persoenliche Seite** (ohne Umbrel-Login, oeffentlich unter
  https://zweers.ch): Startseite in neun Sprachen, Blog unter
  `/<sprache>/posts`, Projekte unter `/<sprache>/projects`, Beitraege unter
  `/<sprache>/<id>`, Apps unter `/apps/<id>`, RSS-Feed unter `/rss.xml`, dazu
  `robots.txt`, `sitemap.xml` und `llms.txt`.

  - **8440 - Admin** (dieser App-Button, mit Umbrel-Login): Websites, Blog-Editor
  mit Live-Vorschau, Links, Profil, Statistik und Einstellungen.

  - **15000-15100 - gehostete Websites**: jede Website auf ihrem eigenen Port.


  ## nrzGit-Automatik

  Jedes Programm (Repo mit Release) auf nrzGit bekommt automatisch eine eigene
  Website: Slogan = About-Text des Repos, Download-Buttons fuer Mac, Windows
  und Linux aus dem neuesten Release und die Summe aller Downloads. Hintergrund,
  Texte und Port sind im Admin bearbeitbar.


  ## Statistik

  Ohne Cookies: Aufrufe, Besucher, Quellen (Google, nrzGit, GitHub, ...),
  Seiten, Geraete, Download-Klicks und RSS-Abrufe.


  Das Programm kommt ohne eigenes Image aus dem nrzWebsite-Repo auf nrzGit
  (Port 8390) auf diesem Geraet - die App nrzGit muss installiert sein.
