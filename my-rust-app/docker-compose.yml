version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-rust-app:latest
    container_name: my-rust-app
    restart: unless-stopped
    init: true
    environment:
      - HOST=0.0.0.0
      - PORT=44544
      - RUST_LOG=info
    ports:
      - "44544:44544"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:44544/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks: {}