version: "3.8"

services:
  # Injected by umbrelOS: publishes the web UI in the app proxy.
  app_proxy:
    environment:
      APP_HOST: nrz-notes_app_1
      APP_PORT: 8330
    container_name: nrz-notes_app_proxy_1

  app:
    # Gepinntes Debian (Multi-Arch-Manifest). nrzNotes ist kein eigenes Image: hooks/pre-start
    # laedt das Programm (Oberflaeche und Excalidraw sind eingebettet) fuer die Architektur dieses
    # Geraets aus dem nrzNotes-Repo auf nrzGit (Zweig umbrel) nach ${APP_DATA_DIR}/app – ohne
    # Registry-Login.
    image: debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    container_name: nrz-notes_app_1
    restart: unless-stopped
    init: true
    user: "1000:1000"
    working_dir: /app
    command: ["/app/nrznotes"]
    stop_grace_period: 15s
    environment:
      - TZ=Europe/Zurich
      # Datenbank (nrznotes.db): Seiten, Journale, Whiteboards, Bilder, Konten.
      - NRZNOTES_DATA_DIR=/data
      # Die ganze Datenbank ist mit SQLCipher verschluesselt. Schluessel ist der APP_SEED dieser
      # Installation (aus dem Umbrel-Seed) – keine Schluesseldatei im Datenordner.
      - NRZNOTES_DB_KEY=${APP_SEED}
      - NRZNOTES_ADDRESS=0.0.0.0
      - NRZNOTES_PORT=8330
      - NRZNOTES_COOKIE_SECURE=false
      - NRZNOTES_LOG=info,rocket::server=warn,rocket::launch::_=warn,rocket::shield=warn
      # Erzwingt pro Release einen frischen Container.
      - APP_VERSION=${APP_VERSION}
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/nrznotes", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
