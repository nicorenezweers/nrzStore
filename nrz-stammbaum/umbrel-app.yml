description: >-
  nrzStammbaum ist eine Ahnenforschungs-App mit Stammbaum, Zeitleiste, Karte,
  Forschungsprotokoll und Quellenverwaltung. Server und Oberflaeche sind in Rust
  geschrieben (axum, Dioxus mit nrzUI), die Daten liegen in einer SQLite-Datei.


  ## Was die App kann


  - **Stammbaum** - Ahnen, Nachkommen und Sanduhr als zieh- und zoombare Flaeche
  mit Kekule-Nummern; Luecken lassen sich direkt fuellen.


  - **Personen und Verwandtschaft** - Lebenslauf mit ungefaehren Daten, Belegen und
  Sicherheit je Angabe; Verwandtschaft auf Deutsch ("Urgrossvater muetterlicherseits").


  - **Zeitleiste und Karte** - Chronik mit Zeitgeschichte, Lebensspannen,
  OpenStreetMap-Karte mit Lebenswegen.


  - **Forschung und Quellen** - Aufgaben mit Protokoll inklusive Negativbefunden,
  automatische Plausibilitaetspruefung, Archiv-Anlaufstellen, Quellen mit Guete.


  - **Dieter, der KI-Assistent** - legt Personen, Ereignisse, Orte und Quellen an,
  verknuepft Beziehungen, belegt Angaben und recherchiert im Web; mit Claude Code
  (offizielle CLI, Abo-Token oder API-Schluessel), Grok oder OpenRouter.


  - **Deep Research** - Dieter forscht selbstaendig ueber Stunden: Checkliste aller
  Archive, Datenbanken, Orte und Personen, Funde mit Belegen, Notizbuch,
  Negativbefunde und Schlussbericht.


  - **Gesamtbaum** - alle Personen und Verbindungen auf einer Flaeche, dazu
  Familienverbindungen auf der Karte.


  - **Streaming-Modus** - blendet alle Namen aus, fuer Bildschirmuebertragungen.


  - **Daten** - Export als JSON und GEDCOM 5.5.1, Import, taegliche Sicherungen.
