port: 8500
path: ""
description: >-
  nrzDashboard ist ein Startbildschirm fuer umbrelOS - komplett in Rust
  (Dioxus fullstack), am Desktop und am Handy.


  ## Was die App kann


  - **Startbildschirm wie umbrelOS** - Begruessung, App-Raster mit Seiten,
  Suche (Cmd/Strg+K), Dock und Hintergrundbild. Live-Anzeige von CPU, RAM und
  Speicher mit Aktualisieren-Knopf.


  - **Apps ueber deine Domains** - jede App oeffnet sich per HTTPS ueber ihre
  Domain aus nrzNetwork, wahlweise als Benutzer (bench.zweers.ch) oder Admin
  (admin.bench.zweers.ch). Rechtsklick oder langes Druecken zeigt beide
  Adressen.


  - **App Store** - Empfehlung, Kategorien, Suche, Details, Installieren und
  Entfernen; Updates einzeln oder alle auf einmal.


  - **Aktivitaet** - CPU-, RAM- und Speicherverbrauch pro App mit Verlauf und
  Temperatur.


  - **Dateien und KI-Agent** - Dateimanager und Assistent fuer dein Umbrel.


  - **Sichere Anmeldung** - Passwort und Zwei-Faktor-Code aus einer
  Authenticator-App.


  ## Erste Schritte


  Mit Benutzer `admin` und dem hier angezeigten Passwort anmelden. Unter
  Einstellungen -> Verbindungen den umbrelOS-MCP-Token (umbrelOS:
  Einstellungen -> AI agents (MCP)) und den nrzNetwork-MCP-Token eintragen.
  Danach unter Einstellungen -> Anmeldung ein eigenes Passwort setzen und die
  Zwei-Faktor-Anmeldung einrichten.
releaseNotes: >-
