description: >-
  Bunker ist ein soziales Netzwerk im Stil von X/Twitter: Beitraege mit bis zu
  500 Zeichen, Antworten, Reposts, Zitate, Likes, Lesezeichen, Hashtags,
  Erwaehnungen und Feeds ("Fuer dich" und "Folge ich"). Direktnachrichten sind
  Ende-zu-Ende verschluesselt. Komplett in Rust mit nrzUI-Oberflaeche.


  ## Was die App kann


  - **Feed wie X** - posten, antworten, reposten, zitieren, liken, folgen,
  Hashtags und Trends, Suche ueber Meilisearch, Mitteilungen in Echtzeit.


  - **Privat** - Direktnachrichten Ende-zu-Ende verschluesselt (X25519 und
  XChaCha20-Poly1305 im Browser), das Passwort verlaesst den Browser nie, alle
  Inhalte liegen verschluesselt auf dem Server.


  - **Keine Uploads** - Profilbilder, Banner und Bilder kommen nur als Link von
  Cubeupload, Postimages, Catbox, Pixeldrain, Imgbox, Pasteboard,
  FreeImage.host, Vgy.me, ImgBB oder Imgur und werden vor dem Anzeigen
  automatisch geprueft (keine Pornografie, keine Gewalt).


  - **KI-Moderation ohne Menschen** - ein Team aus KI-Agenten (OpenRouter, xAI
  Grok oder Anthropic Claude) prueft jeden Beitrag sofort: Triage,
  Regel-Richter, Strafmass. Verwarnungen, Timeouts und Sperren mit Begruendung,
  Einsprueche werden automatisch entschieden, alles im Moderationslog.


  - **Zwei Oberflaechen** - die oeffentliche Seite (Port 8542, darf ins
  Internet) hat keinerlei Admin-Funktionen. Die Admin-Oberflaeche laeuft auf
  Port 8543 und ist nur im eigenen Netz erreichbar.


  ## Erste Schritte


  Admin-Oberflaeche unter http://umbrel.local:8543 mit Benutzer `nrz` und dem
  hier angezeigten Passwort oeffnen und unter "KI-Team" einen API-Schluessel
  (OpenRouter, xAI oder Anthropic) eintragen. Danach moderiert Bunker selbst.
