services:
  # Injected by umbrelOS: oeffentlicher Port 8542 (ins Internet freigebbar).
  app_proxy:
    environment:
      APP_HOST: nrz-bunker-social_web_1
      APP_PORT: 8542
    container_name: nrz-bunker-social_app_proxy_1

  web:
    # Bunker ist kein eigenes Image: hooks/pre-start laedt Server (Rust) und beide Oberflaechen
    # (Dioxus/WASM) fuer die Architektur dieses Geraets aus dem Bunker-Repo auf nrzGit.
    image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    container_name: nrz-bunker-social_web_1
    restart: unless-stopped
    init: true
    user: "1000:1000"
    working_dir: /data
    command: ["/app/bunker"]
    stop_grace_period: 20s
    # Admin-Oberflaeche nur im eigenen Netz (nicht ueber den App-Proxy, nicht ins Internet).
    ports:
      - "8543:8543"
    environment:
      - TZ=Europe/Zurich
      - RUST_LOG=warn,bunker=info
      - BUNKER_BIND=0.0.0.0:8542
      - BUNKER_ADMIN_BIND=0.0.0.0:8543
      - BUNKER_DATA=/data
      - BUNKER_WEB_DIR=/app/web
      - BUNKER_ADMIN_WEB_DIR=/app/admin
      - BUNKER_SQLITE=/data/bunker.sqlite
      # Admin `nrz` mit dem in umbrelOS angezeigten Passwort (wird bei jedem Start gesetzt).
      - BUNKER_ADMIN_NAME=nrz
      - BUNKER_ADMIN_PASSWORD=${APP_PASSWORD}
      # Hauptgeheimnis fuer die Verschluesselung aller Inhalte (aus dem App-Seed abgeleitet).
      - BUNKER_MASTER_KEY=${APP_SEED}-bunker-master
      # Nur der umbrelOS app_proxy erreicht Port 8542: Client-IP aus X-Forwarded-For.
      - BUNKER_TRUST_PROXY=true
      - BUNKER_SURREAL_URL=ws://nrz-bunker-social_surrealdb_1:8000
      - BUNKER_SURREAL_USER=root
      - BUNKER_SURREAL_PASSWORD=${APP_SEED}
      - BUNKER_SKYTABLE=nrz-bunker-social_skytable_1:2003
      - BUNKER_SKYTABLE_PASSWORD=${APP_SEED}
      - BUNKER_MEILI_URL=http://nrz-bunker-social_meilisearch_1:7700
      - BUNKER_MEILI_KEY=${APP_SEED}
      # Erzwingt pro Release einen frischen Container.
      - APP_VERSION=${APP_VERSION}
    depends_on:
      surrealdb:
        condition: service_started
      skytable:
        condition: service_started
      meilisearch:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/data/bunker:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  surrealdb:
    # Hauptdatenbank (RocksDB auf der Platte), nur intern erreichbar.
    image: surrealdb/surrealdb:v4.0.1@sha256:408eb8e5c9436670525e2bc2634b1e50ba74ce1b447eaf0094c35f73b67f9cb6
    container_name: nrz-bunker-social_surrealdb_1
    restart: unless-stopped
    init: true
    user: "1000:1000"
    command: ["start", "--user", "root", "--pass", "${APP_SEED}", "--bind", "0.0.0.0:8000", "--log", "warn", "rocksdb:///data/db"]
    environment:
      - APP_VERSION=${APP_VERSION}
    volumes:
      - ${APP_DATA_DIR}/data/surrealdb:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  skytable:
    # Heisse Zaehler (Likes, Follower, Ungelesen), Praesenz, Cache. Offizielles skyd-Binary
    # (amd64/arm64) aus dem Release-Paket, siehe hooks/pre-start.
    image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    container_name: nrz-bunker-social_skytable_1
    restart: unless-stopped
    init: true
    user: "1000:1000"
    working_dir: /data
    command: ["/app/skyd", "--mode", "prod", "--endpoint", "tcp@0.0.0.0:2003", "--auth-plugin", "pwd", "--auth-root-password", "${APP_SEED}"]
    environment:
      - APP_VERSION=${APP_VERSION}
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/data/skytable:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  meilisearch:
    # Volltextsuche (nur oeffentliche Beitraege und Profile).
    image: getmeili/meilisearch:v1.57.0@sha256:91bf09897482c17205c8faeca8daa8d57999fb9de20d862763cdfa92ba4ec790
    container_name: nrz-bunker-social_meilisearch_1
    restart: unless-stopped
    init: true
    user: "1000:1000"
    environment:
      - MEILI_MASTER_KEY=${APP_SEED}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_DB_PATH=/meili_data/data.ms
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - APP_VERSION=${APP_VERSION}
    volumes:
      - ${APP_DATA_DIR}/data/meilisearch:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7700/health || curl -fsS http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
