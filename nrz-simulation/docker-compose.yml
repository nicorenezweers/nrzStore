services:
  # Injected by umbrelOS.
  app_proxy:
    environment:
      APP_HOST: nrz-simulation_web_1
      APP_PORT: 8080
    container_name: nrz-simulation_app_proxy_1

  web:
    # Gepinntes nginx (unprivilegiert, Multi-Arch-Manifest). nrzSimulation ist kein eigenes
    # Image: hooks/pre-start laedt den fertigen Web-Build (Release-Asset im nrzSimulation-Repo
    # auf nrzGit) nach ${APP_DATA_DIR}/app/www. Das Spiel laeuft komplett im Browser,
    # Spielstaende liegen im localStorage - auf dem Geraet wird nichts gespeichert.
    image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    container_name: nrz-simulation_web_1
    restart: unless-stopped
    init: true
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # Erzwingt pro Release einen frischen Container.
      - APP_VERSION=${APP_VERSION}
    volumes:
      - ${APP_DATA_DIR}/app/www:/usr/share/nginx/html:ro
      - ${APP_DATA_DIR}/app/conf.d:/etc/nginx/conf.d:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
